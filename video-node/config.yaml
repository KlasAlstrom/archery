camera:
  type: picam
  device: /dev/video0
  width: 1280
  height: 720
  fps: 30
  input_format: mjpeg

buffer:
  base_dir: /dev/shm/video-node
  segment_count: 20
  segment_seconds: 1

trigger:
  pre_seconds: 3
  post_seconds: 3
  trigger_index_offset: 0
  port: 8080

server:
  upload_url: http://192.168.60.1/api/upload
  token: archery-video-2026

clip:
  max_retry_seconds: 30
